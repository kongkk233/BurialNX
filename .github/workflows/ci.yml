name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host:
    name: Host validation (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate example profile
        run: npm run profile:validate -- profiles/examples/minimal-mv.json
      - name: Run generic package contract acceptance
        run: npm run accept:package
      - name: Run generic package runtime acceptance
        run: npm run accept:package:runtime
      - name: Check neutral port contract
        run: npm run port:check -- --game-root tests/fixtures/neutral-mv/www
      - name: Run neutral host acceptance
        run: npm run accept:host
      - name: Run mod overlay host acceptance
        run: npm run accept:overlay
      - name: Run neutral contract smoke
        run: npm run smoke:neutral
      - name: Run host tests
        run: npm test
      - name: Typecheck production graph
        run: npm run typecheck

  browser:
    name: Desktop browser media validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Locate or install Chromium
        id: chrome
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome" ]; then
            sudo apt-get update
            sudo apt-get install --yes chromium
            chrome="$(command -v chromium)"
          fi
          test -x "$chrome"
          echo "path=$chrome" >> "$GITHUB_OUTPUT"
      - name: Run desktop media probe
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.path }}
        run: npm run test:movie:browser -- --report browser-validation.json
      - name: Upload browser validation report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-validation
          path: browser-validation.json
          if-no-files-found: error
          retention-days: 7

  native-rebuild:
    name: Pinned amd64 native rebuild evidence
    runs-on: ubuntu-latest
    container: ghcr.io/tootallnate/pacman-packages@sha256:92880d77878639768fe3696800104d68de1dfec65802bf7915689dd7bd718e53
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install native build dependencies
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install --yes --no-install-recommends nodejs npm ca-certificates
          npm ci
      - name: Download and verify pinned source archive
        shell: bash
        env:
          BURIALNX_SOURCE_ARCHIVE_SHA256: 0477b6b094b69984f97cac3f2a84fef352e2e7bdb01387596425662b2a7622d3
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --output nxjs-source.tar.gz https://codeload.github.com/TooTallNate/nx.js/tar.gz/a649611a1a4daca09924cd1a436c7ca786f91592
          echo "${BURIALNX_SOURCE_ARCHIVE_SHA256}  nxjs-source.tar.gz" | sha256sum --check --strict
          mkdir nxjs-source
          tar -xzf nxjs-source.tar.gz --strip-components=1 -C nxjs-source
      - name: Run fail-closed native rebuild
        shell: bash
        env:
          DEVKITPRO: /opt/devkitpro
          BURIALNX_SOURCE_ARCHIVE_SHA256: 0477b6b094b69984f97cac3f2a84fef352e2e7bdb01387596425662b2a7622d3
          BURIALNX_SDK_IMAGE: ghcr.io/tootallnate/pacman-packages@sha256:92880d77878639768fe3696800104d68de1dfec65802bf7915689dd7bd718e53
        run: |
          set +e
          node tools/rebuild-preroll-runtime.mjs nxjs-source native-build > native-rebuild.log 2>&1
          rc=$?
          set -e
          test -f native-build/native-rebuild-report.json
          cp native-build/native-rebuild-report.json .
          status="$(node -e "console.log(JSON.parse(require('fs').readFileSync('native-rebuild-report.json')).status)")"
          if [ "$status" = mismatch ]; then
            test "$rc" -ne 0
            echo "Expected executable digest mismatch recorded as not-verified evidence"
            exit 0
          fi
          test "$status" = pass
          exit "$rc"
      - name: Upload native rebuild evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-rebuild-evidence
          path: |
            native-rebuild-report.json
            native-rebuild.log
          if-no-files-found: error
          retention-days: 7

  release:
    name: Clean reproducible release gate
    runs-on: ubuntu-latest
    needs: [host, browser, native-rebuild]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download browser validation report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: browser-validation
          path: .
      - name: Download native rebuild report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: native-rebuild-evidence
          path: .
      - name: Verify clean reproducible release
        env:
          BURIALNX_REUSE_BROWSER_REPORT: '1'
        run: npm run verify:release
