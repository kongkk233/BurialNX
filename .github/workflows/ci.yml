name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host:
    name: Host validation (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate example profile
        run: npm run profile:validate -- profiles/examples/minimal-mv.json
      - name: Run generic package acceptance
        run: npm run accept:package
      - name: Check neutral port contract
        run: npm run port:check -- --game-root tests/fixtures/neutral-mv/www
      - name: Run neutral host acceptance
        run: npm run accept:host
      - name: Run mod overlay host acceptance
        run: npm run accept:overlay
      - name: Run neutral contract smoke
        run: npm run smoke:neutral
      - name: Run host tests
        run: npm test
      - name: Typecheck production graph
        run: npm run typecheck

  browser:
    name: Desktop browser media validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Locate or install Chromium
        id: chrome
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome" ]; then
            sudo apt-get update
            sudo apt-get install --yes chromium
            chrome="$(command -v chromium)"
          fi
          test -x "$chrome"
          echo "path=$chrome" >> "$GITHUB_OUTPUT"
      - name: Run desktop media probe
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.path }}
        run: npm run test:movie:browser -- --report browser-validation.json

  release:
    name: Clean reproducible release gate
    runs-on: ubuntu-latest
    needs: [host, browser]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify clean reproducible release
        run: npm run verify:release
