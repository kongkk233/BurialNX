name: Build NRO

# Ручной запуск: на странице репозитория → Actions → "Build NRO" → Run workflow
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag matching package.json (for example v0.2.0)'
        required: true
        default: 'v0.2.0'
      create_release:
        description: 'Create a GitHub Release with the .nro files'
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    # GITHUB_TOKEN по умолчанию read-only — для создания релизов
    # нужны права на запись в репозиторий.
    permissions:
      contents: write

    steps:
      # 1. Checkout кода
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify release tag points to checked out commit
        env:
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          expected="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          actual="$(git rev-parse HEAD)"
          if [ "$expected" != "$actual" ]; then
            echo "release tag ${RELEASE_TAG} points to ${expected}, but checkout is ${actual}" >&2
            exit 1
          fi

      # 2. Установить Node.js
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      # 3. Установить зависимости
      - name: Install dependencies
        run: npm ci

      - name: Validate requested version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: node -e "const p=require('./package.json'); const v=process.env.REQUESTED_VERSION.replace(/^v/,''); if(v!==p.version) throw new Error('tag '+v+' does not match package '+p.version)"

      # This verifies the release NRO and remains explicitly host-only:
      # smoke/browser/native/hardware validation is reported separately.
      - name: Verify release NRO
        run: npm run verify:release

      # Build the debug artifact after the release manifest has been frozen.
      - name: Build debug NRO
        run: npm run build -- --debug

      # 8. Загрузить артефакты (доступны для скачивания в Actions)
      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: BurialNX-${{ inputs.version }}
          path: |
            burialnx.nro
            burialnx-debug.nro
            release-manifest.json
          retention-days: 30

      # 9. Создать GitHub Release (если выбрано)
      - name: Create GitHub Release
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          tag_name: ${{ inputs.version }}
          name: BurialNX ${{ inputs.version }}
          body: |
            ## BurialNX ${{ inputs.version }}

            ### Installation
            1. Copy `burialnx.nro` to `sdmc:/switch/burialnx/`
            2. Launch from hbmenu

            ### Debug build
            `burialnx-debug.nro` — includes extra logging
            and diagnostic menu items. Logs are written to
            `sdmc:/switch/burialnx/LOGS/`
          files: |
            burialnx.nro
            burialnx-debug.nro
            release-manifest.json
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
