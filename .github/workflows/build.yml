name: Build NRO

# Ручной запуск: на странице репозитория → Actions → "Build NRO" → Run workflow
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag matching package.json (e.g. v0.1.6-cg.6)'
        required: true
        default: 'v0.1.6-cg.6'
      create_release:
        description: 'Create a GitHub Release with the .nro files'
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    # GITHUB_TOKEN по умолчанию read-only — для создания релизов
    # нужны права на запись в репозиторий.
    permissions:
      contents: write

    steps:
      # 1. Checkout кода
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Установить Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Установить зависимости
      - name: Install dependencies
        run: npm ci

      - name: Validate requested version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: node -e "const p=require('./package.json'); const v=process.env.REQUESTED_VERSION.replace(/^v/,''); if(v!==p.version) throw new Error('tag '+v+' does not match package '+p.version)"

      # This verifies the release NRO and remains explicitly host-only:
      # smoke/browser/native/hardware validation is reported separately.
      - name: Verify release NRO
        run: npm run verify:release

      # Build the debug artifact after the release manifest has been frozen.
      - name: Build debug NRO
        run: npm run build -- --debug

      # 8. Загрузить артефакты (доступны для скачивания в Actions)
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BurialNX-${{ inputs.version }}
          path: |
            burialnx.nro
            burialnx-debug.nro
            release-manifest.json
          retention-days: 30

      # 9. Создать GitHub Release (если выбрано)
      - name: Create GitHub Release
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: BurialNX ${{ inputs.version }}
          body: |
            ## BurialNX ${{ inputs.version }}

            ### Installation
            1. Copy `burialnx.nro` to `sdmc:/switch/burialnx/`
            2. Launch from hbmenu

            ### Debug build
            `burialnx-debug.nro` — includes extra logging
            and diagnostic menu items. Logs are written to
            `sdmc:/switch/burialnx/LOGS/`
          files: |
            burialnx.nro
            burialnx-debug.nro
            release-manifest.json
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
